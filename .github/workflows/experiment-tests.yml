name: Experiment Tests

# Runs on every PR to main (and pushes to main) that touch the experiment app, so
# a broken change is caught here rather than by the post-merge image build.
on:
  push:
    branches:
      - main
    paths:
      - 'experiment/**'
      - '.github/workflows/experiment-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'experiment/**'
      - '.github/workflows/experiment-tests.yml'
  workflow_dispatch:

# Least privilege: these jobs only need to read the repo to check it out.
permissions:
  contents: read

defaults:
  run:
    working-directory: experiment

jobs:
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: experiment/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # `npm test` is watch mode in this package; test:run is the one-shot script.
      - name: Run unit tests
        run: npm run test:run
