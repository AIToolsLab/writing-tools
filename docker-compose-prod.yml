services:
  # Combined container takes over the old frontend public port (19571).
  backend:
    ports:
      - "19571:5000"
    environment:
      - PORT=5000
      - DEBUG=False
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Thoughtful-demo project key: pays for sessionless (demo-mode) requests, capped
      # on OpenAI's side. Unset => sessionless requests are refused. See openaiProxy.ts.
      - OPENAI_DEMO_API_KEY=${OPENAI_DEMO_API_KEY:-}
      - POSTHOG_PROJECT_TOKEN=${POSTHOG_PROJECT_TOKEN:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://e.thoughtful-ai.com/}
      # Management API (personal key + project id) — required for "delete my data"
      # to purge a user's PostHog person/events. Unset => deletion no-ops with a
      # warning (see deletePosthogPerson). Verified post-deploy in issue #517.
      - POSTHOG_PERSONAL_API_KEY=${POSTHOG_PERSONAL_API_KEY:-}
      - POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID:-}
      # Fixed public OAuth client for the standalone Mindmap. Neither value is a
      # secret. They are set here rather than left to the deploy environment because
      # the backend refuses to boot in production without them: missing values
      # would take production down, not just disable Mindmap login.
      # The redirect URI must match the Mindmap bundle's origin + path exactly,
      # trailing slash included.
      - MINDMAP_OAUTH_CLIENT_ID=${MINDMAP_OAUTH_CLIENT_ID:-writing-tools-mindmap}
      - MINDMAP_OAUTH_REDIRECT_URIS=${MINDMAP_OAUTH_REDIRECT_URIS:-https://mindmap.thoughtful-ai.com/}
    volumes:
      # Single persistent volume (app.db + logs/). One-time host migration:
      #   mkdir -p /opt/thoughtful/data/logs
      #   mv /opt/thoughtful/auth/auth.db /opt/thoughtful/data/
      #   mv /opt/thoughtful/logs/* /opt/thoughtful/data/logs/
      - /opt/thoughtful/data:/app/backend/data

  experiment:
    ports:
      - "19572:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - /opt/thoughtful/experiment-logs:/app/logs

networks:
  default:
    driver: bridge
